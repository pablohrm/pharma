<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - pharmapy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header Simples -->
    <nav class="bg-white shadow-sm p-4 flex justify-between items-center">
        <a href="index.html" class="text-blue-600 font-bold text-xl">pharmapy</a>
        <a href="login.html" class="text-gray-600 text-sm hover:underline">Já tenho conta</a>
    </nav>

    <div class="max-w-md mx-auto mt-12 p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Crie sua conta</h2>
            <p class="text-gray-500 text-sm">Cadastre-se para acompanhar seus pedidos e salvar formas de pagamento.</p>
        </div>

        <form action="salvar.php" method="POST" class="space-y-4">
            <!-- Campo Oculto para o PHP saber que é um CADASTRO -->
            <input type="hidden" name="tipo_operacao" value="CADASTRO">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-3 text-gray-400 w-4 h-4"></i>
                    <input type="text" name="nome" required placeholder="Digite seu nome" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-3 text-gray-400 w-4 h-4"></i>
                    <input type="email" name="email" required placeholder="seu@email.com" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-3 text-gray-400 w-4 h-4"></i>
                    <input type="password" name="senha" required placeholder="Crie uma senha" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                Finalizar Cadastro
            </button>
        </form>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
